name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build tarball (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
            env: {}
          - target: x86_64-unknown-linux-musl
            packages: "musl-tools"
            env: {}
          - target: aarch64-unknown-linux-gnu
            packages: "gcc-aarch64-linux-gnu"
            env:
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install system dependencies
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env: ${{ matrix.env }}
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          ARCHIVE_NAME="ramwise-${{ env.RELEASE_TAG }}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/ramwise" "dist/${ARCHIVE_NAME}/"
          cp LICENSE "dist/${ARCHIVE_NAME}/"
          cp README.md "dist/${ARCHIVE_NAME}/"
          tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
          cd dist
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  package-rpms:
    name: Package RPMs (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-26.04
            packages: ""
            env: 
              ARCH: x86_64
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-26.04-arm
            packages: ""
            env: 
              ARCH: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm  
      - name: Make spec file
        env: ${{ matrix.env }}
        run: |
          chmod 777 scripts/gen-spec.sh
          scripts/gen-spec.sh ${ARCH} ${RELEASE_VERSION}
      - name: Build RPM package
        id: rpm_build
        env: ${{ matrix.env }}
        uses: naveenrajm7/rpmbuild@3a7282e96d04bc88ebdeb0ec422569f01b5bfa0a
        with:
          spec_file: "ramwise-${{ env.ARCH }}.spec"
      - name: Find RPM
        id: find_rpm
        shell: bash
        run: |
          RPM=$(find rpmbuild/RPMS -type f -name '*.rpm' | head -n 1)

          echo "Found RPM: $RPM"
          echo "rpm_path=$RPM" >> "$GITHUB_OUTPUT"

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.target }}
          path: |
            ${{ steps.find_rpm.outputs.rpm_path }}

  publish-release:
    name: Create GitHub Release
    needs: [package-rpms, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Generate unified checksums
        run: |
          cd artifacts
          cat *.sha256 > sha256sums.txt
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ramwise ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*

  publish-aur:
    name: Publish to AUR
    needs: publish-release
    runs-on: ubuntu-latest
    if: github.repository == 'Duckaet/ramwise'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Check AUR SSH Key
        id: check-key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::notice ::AUR_SSH_PRIVATE_KEY is not configured in GitHub Secrets. Skipping automated AUR push. You can publish manually with scripts/publish-aur.sh"
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to AUR
        if: steps.check-key.outputs.has_key == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: ramwise
          pkgbuild: aur/ramwise/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME || 'duckaet' }}
          commit_email: ${{ secrets.AUR_EMAIL || 'parascodes247@gmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.RELEASE_VERSION }}"
          updpkgsums: true
  

            
        
        
